# Lokal infrastruktur til udvikling. Services (ChatService, GatewayAPI, frontend) køres stadig fra Visual Studio.
# Start:  docker compose up -d
# Nulstil database (kør schema/seed igen): docker compose down -v && docker compose up -d
name: bizcord
services:
  chatdb:
    image: postgres:17-bookworm
    environment:
      POSTGRES_DB: chatdb
      POSTGRES_USER: ${POSTGRES_USER:-bizcord}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-bizcord}
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d chatdb"]
      interval: 2s
      timeout: 5s
      retries: 30
    volumes:
      - chatdata:/var/lib/postgresql/data
      # Scripts i /docker-entrypoint-initdb.d køres i alfabetisk rækkefølge, KUN første gang (tom volume)
      - ./apps/chat-microservice/database/01-schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./apps/chat-microservice/database/02-seed.sql:/docker-entrypoint-initdb.d/02-seed.sql:ro
  # Message broker (posthuset). 5672 = AMQP, som services taler med. 15672 = web-UI: http://localhost:15672
  rabbitmq:
    image: rabbitmq:4-management
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-bizcord}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-bizcord}
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 30
volumes:
  chatdata:
