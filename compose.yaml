# Lokal infrastruktur (databaser, RabbitMQ) + microservices i containere.
# Kun infrastruktur (services køres fra Visual Studio):  docker compose up -d
# Også microservices i Docker (profile "apps"):          docker compose --profile apps up -d --build
# Stop microservices igen (infrastrukturen kører videre): docker compose --profile apps stop chat-microservice realtime-communication
# Nulstil database (kør schema/seed igen): docker compose down -v && docker compose up -d
name: bizcord
services:
  chatdb:
    image: postgres:17-bookworm
    environment:
      POSTGRES_DB: chatdb
      POSTGRES_USER: ${POSTGRES_USER:-bizcord}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-bizcord}
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d chatdb"]
      interval: 2s
      timeout: 5s
      retries: 30
    volumes:
      - chatdata:/var/lib/postgresql/data
      # Scripts i /docker-entrypoint-initdb.d køres i alfabetisk rækkefølge, KUN første gang (tom volume)
      - ./apps/chat-microservice/database/01-schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./apps/chat-microservice/database/02-seed.sql:/docker-entrypoint-initdb.d/02-seed.sql:ro
  # DUMMY: RealTimeCommunicationService' egen database (database per service, ADR 0002). Port 5433, så den ikke støder ind i chatdb.
  realtimedb:
    image: postgres:17-bookworm
    environment:
      POSTGRES_DB: realtimedb
      POSTGRES_USER: ${POSTGRES_USER:-bizcord}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-bizcord}
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d realtimedb"]
      interval: 2s
      timeout: 5s
      retries: 30
    volumes:
      - realtimedata:/var/lib/postgresql/data
      - ./apps/realtime-communication/database/01-schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
  # Message broker (posthuset). 5672 = AMQP, som services taler med. 15672 = web-UI: http://localhost:15672
  rabbitmq:
    image: rabbitmq:4-management
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-bizcord}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-bizcord}
    ports:
      - "5672:5672"
      - "15672:15672"
    # Health check: rabbitmq-diagnostics følger med i imaget. "ping" svarer først OK, når RabbitMQ er klar.
    # Uden den ville depends_on kun vente på, at containeren er STARTET – ikke at RabbitMQ er klar (connection refused)
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 30

  # ---- Microservices (profile "apps": startes kun med --profile apps) ----
  # Inde i Docker-netværket hedder de andre containere deres servicenavn (chatdb, rabbitmq) – ikke localhost.
  # Konfiguration som miljøvariabler: .NET læser ConnectionStrings__RabbitMQ som ConnectionStrings:RabbitMQ
  # (samme nøgle som user-secrets bruger), så koden er uændret.
  chat-microservice:
    profiles: ["apps"]
    build:
      context: .                                     # roden af repoet (Dockerfilen kopierer fra shared/ og apps/)
      dockerfile: apps/chat-microservice/Dockerfile
    depends_on:
      rabbitmq:
        condition: service_healthy                   # vent til health checket er grønt, ikke bare startet
      chatdb:
        condition: service_healthy
    ports:
      - "8010:8080"                                  # 8010 på din maskine, så den ikke støder ind i 5210 fra Visual Studio
    environment:
      ConnectionStrings__ChatDb: "Host=chatdb;Database=chatdb;Username=${POSTGRES_USER:-bizcord};Password=${POSTGRES_PASSWORD:-bizcord}"
      ConnectionStrings__RabbitMQ: "host=rabbitmq;username=${RABBITMQ_USER:-bizcord};password=${RABBITMQ_PASSWORD:-bizcord}"

  # DUMMY: modtager MessageSent fra chat-microservice via RabbitMQ (ADR 0017)
  realtime-communication:
    profiles: ["apps"]
    build:
      context: .
      dockerfile: apps/realtime-communication/Dockerfile
    depends_on:
      rabbitmq:
        condition: service_healthy
      realtimedb:
        condition: service_healthy
    ports:
      - "8020:8080"                                  # 8020, så den ikke støder ind i 5220 fra Visual Studio
    environment:
      ConnectionStrings__RealTimeDb: "Host=realtimedb;Database=realtimedb;Username=${POSTGRES_USER:-bizcord};Password=${POSTGRES_PASSWORD:-bizcord}"
      ConnectionStrings__RabbitMQ: "host=rabbitmq;username=${RABBITMQ_USER:-bizcord};password=${RABBITMQ_PASSWORD:-bizcord}"

volumes:
  chatdata:
  realtimedata:
